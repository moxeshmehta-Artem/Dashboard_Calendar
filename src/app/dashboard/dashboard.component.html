<div class="dashboard-container" style="padding: 20px;">
  <h2>Dashboard</h2>
  
  <div style="display: flex; gap: 20px; flex-wrap: wrap;">
    <!-- Chart Section -->
    <div style="flex: 1; min-width: 300px; height: 400px; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
      <h3>Appointment Statistics</h3>
      <canvas baseChart
        [data]="lineChartData"
        [options]="lineChartOptions"
        [legend]="lineChartLegend"
        [type]="'line'">
      </canvas>
    </div>

    <!-- Calendar Section -->
    <div style="flex: 1; min-width: 300px; border: 1px solid #ddd; padding: 10px; border-radius: 8px;">
      <h3>Calendar</h3>
      <full-calendar [options]="calendarOptions"></full-calendar>
    </div>
  </div>
</div>
